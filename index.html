    <script>
      const themeToggleBtn = document.getElementById('theme-toggle');
      const htmlElement = document.documentElement;

      themeToggleBtn.addEventListener('click', () => {
        htmlElement.classList.toggle('dark');
      });

      const canvas = document.getElementById('cursor-trail');
      const ctx = canvas.getContext('2d');
      let points = [];
      let mouse = { x: 0, y: 0 };

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        points.push({ x: mouse.x, y: mouse.y, life: 1 });
      });

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = htmlElement.classList.contains('dark') ? 'rgba(255,255,255,0.8)' : 'rgba(0,0,0,0.8)';
        ctx.fill();

        ctx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          ctx.lineWidth = p.life * 4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = htmlElement.classList.contains('dark') 
            ? `rgba(255, 255, 255, ${p.life * 0.5})` 
            : `rgba(0, 0, 0, ${p.life * 0.5})`;

          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
          
          p.life -= 0.05;
        }
        ctx.stroke();

        points = points.filter(p => p.life > 0);
        requestAnimationFrame(animate);
      }
      animate();
    </script>
